name: Deploy Frontend to Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'frontend/nextgenscores/**'   # only runs when frontend code actually changes

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend/nextgenscores
        run: npm ci

      - name: Build
        working-directory: frontend/nextgenscores
        run: npm run build

      - name: Deploy dist/ to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: frontend/nextgenscores/dist/
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**