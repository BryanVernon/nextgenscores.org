name: Refresh Scoreboard

on:
  schedule:
    # GitHub Actions cron is UTC. Render allows only 7 AM and 7 PM America/Chicago,
    # so this remains correct during both CST and CDT.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run immediately, even outside the normal 7 AM/7 PM Central windows'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: refresh-scoreboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCOREBOARD_JOB_URL: https://nextgenscores-org.onrender.com/api/jobs/scoreboard-refresh
      SCOREBOARD_JOB_TOKEN: ${{ secrets.SCOREBOARD_JOB_TOKEN }}
      FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
    steps:
      - name: Trigger the protected Render scoreboard refresh
        run: |
          node --input-type=module -e '
            if (!process.env.SCOREBOARD_JOB_TOKEN) {
              console.error("Add the SCOREBOARD_JOB_TOKEN Actions secret.");
              process.exit(1);
            }
          '
          curl --fail-with-body --show-error --retry 2 --retry-all-errors --max-time 600 \
            --request POST "$SCOREBOARD_JOB_URL" \
            --header "Authorization: Bearer $SCOREBOARD_JOB_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"force\":$FORCE}"
